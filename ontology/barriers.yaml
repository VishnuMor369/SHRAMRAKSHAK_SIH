version: "1.0.0"
barriers:
  - id: "EXCLUSION_ZONE"
    name: "Physical / Demarcated Exclusion Zone"
    category: "Physical"
    description: "Physical barricade, danger tape, chain, or designated restricted perimeter separating workers from hazard."
    keywords:
      - "exclusion zone"
      - "barricade"
      - "danger tape"
      - "barrier tape"
      - "red zone"
      - "perimeter"
      - "restricted zone"
      - "cordon"
      - "boundary"

  - id: "ENERGY_ISOLATION"
    name: "Positive Energy Isolation (LOTO)"
    category: "Physical/Procedural"
    description: "Lockout, tagout, double block and bleed, spade installation, physical disconnect verified zero-energy state."
    keywords:
      - "energy isolation"
      - "lockout"
      - "tagout"
      - "loto"
      - "padlock"
      - "hasp"
      - "isolation valve"
      - "double block and bleed"
      - "zero energy"

  - id: "WORK_AUTHORIZATION"
    name: "Permit to Work & Work Authorization"
    category: "Administrative"
    description: "Valid Permit to Work (PTW), Job Safety Analysis (JSA/TRA), toolbox talk, and supervisor authorization."
    keywords:
      - "permit to work"
      - "ptw"
      - "work authorization"
      - "jsa"
      - "job safety analysis"
      - "toolbox talk"
      - "work permit"
      - "hot work permit"
      - "entry permit"

  - id: "GAS_TESTING"
    name: "Atmospheric & Flammable Gas Testing"
    category: "Operational"
    description: "Calibrated multi-gas detector test for LEL, Oxygen, H2S, and CO before and continuously during work."
    keywords:
      - "gas testing"
      - "gas detector"
      - "lel test"
      - "h2s check"
      - "oxygen level"
      - "atmospheric test"
      - "calibrated gas monitor"

  - id: "FALL_PROTECTION"
    name: "Personal Fall Protection & Edge Guardrails"
    category: "Physical"
    description: "Full body harness, 100% tie-off lanyards, inertia reels, certified anchor points, scaffolding toe-boards and guardrails."
    keywords:
      - "fall protection"
      - "safety harness"
      - "lanyard"
      - "tie off"
      - "anchor point"
      - "guardrail"
      - "scaffold railing"
      - "inertia reel"
      - "lifeline"

  - id: "LIFTING_CONTROL"
    name: "Lifting Plan & Rigging Integrity"
    category: "Operational"
    description: "Approved lift plan, certified rigging gear, tag lines, crane load chart compliance, and designated banksman."
    keywords:
      - "lift plan"
      - "rigging gear"
      - "tag line"
      - "tagline"
      - "banksman"
      - "rigger"
      - "crane inspection"
      - "slings inspected"
      - "lifting control"

  - id: "TRAFFIC_SEGREGATION"
    name: "Pedestrian & Heavy Vehicle Segregation"
    category: "Physical/Operational"
    description: "Walkways, vehicle traffic routes, banksman escort, speed limiters, physical crash barriers."
    keywords:
      - "traffic segregation"
      - "pedestrian walkway"
      - "vehicle barrier"
      - "banksman for vehicle"
      - "spotter"
      - "bollards"

  - id: "INTERLOCK_GUARD"
    name: "Machine Guarding & Safety Interlocks"
    category: "Physical"
    description: "Fixed guards over moving shafts, interlock switches, emergency stop buttons, light curtains."
    keywords:
      - "machine guard"
      - "interlock"
      - "safety guard"
      - "e-stop"
      - "emergency stop"
      - "protective cage"
      - "nip guard"

  - id: "PRIMARY_WELL_CONTROL"
    name: "Primary Well Control (Drilling Fluid Hydrostatic Column)"
    category: "Operational"
    description: "Hydrostatic pressure exerted by drilling mud column exceeding formation pore pressure without exceeding fracture gradient."
    keywords:
      - "drilling mud"
      - "mud weight"
      - "hydrostatic head"
      - "mud column"
      - "primary well control"
      - "kill mud"
      - "bottom hole pressure"

  - id: "SECONDARY_WELL_BARRIER"
    name: "Secondary Well Barrier (Mechanical Enclosure / Casing)"
    category: "Physical"
    description: "Surface casing, intermediate casing, wellhead, casing hanger seals preventing fluid escape to surface or formations."
    keywords:
      - "casing string"
      - "surface casing"
      - "wellhead seal"
      - "casing hanger"
      - "secondary well barrier"
      - "liner"

  - id: "BOP_INTEGRITY"
    name: "Blowout Preventer (BOP) Stack Integrity"
    category: "Physical/Operational"
    description: "Annular preventer, pipe rams, blind shear rams, choke & kill lines tested and ready to seal wellbore."
    keywords:
      - "bop"
      - "blowout preventer"
      - "annular preventer"
      - "pipe ram"
      - "blind shear ram"
      - "accumulator bottle"
      - "choke manifold"
      - "bop stack"

  - id: "WELL_INTEGRITY_VERIFICATION"
    name: "Well Integrity Monitoring & Verification"
    category: "Operational"
    description: "Pit level recording, flow show indicators, acoustic logs, calliper logs, formation integrity tests."
    keywords:
      - "pit level"
      - "mud volume totalizer"
      - "flow show"
      - "formation integrity test"
      - "fit test"
      - "lot test"
      - "well integrity verification"

  - id: "PRESSURE_TESTING"
    name: "Pressure Relief & Hydrostatic Proof Control"
    category: "Physical/Operational"
    description: "Pressure relief valves (PRV), burst disks, high-pressure test barriers, calibrated relief systems."
    keywords:
      - "pressure relief"
      - "prv"
      - "burst disk"
      - "relief valve"
      - "hydrostatic proof"
      - "pressure bleed off"

  - id: "CEMENT_BARRIER"
    name: "Cement Sheath & Plug Barrier"
    category: "Physical"
    description: "Cemented casing annulus, cement plug, or kick-off plug tested to ensure hydraulic isolation."
    keywords:
      - "cement plug"
      - "cement sheath"
      - "annular cement"
      - "cement bond log"
      - "cbl"
      - "cement barrier"

  - id: "WELL_CONTROL_PROCEDURE"
    name: "Driller's Well Control Drill & Procedure"
    category: "Procedural"
    description: "Driller method, wait and weight method, shut-in drill, well control response sequence."
    keywords:
      - "well control procedure"
      - "shut-in"
      - "driller method"
      - "wait and weight"
      - "well control drill"
      - "choke line procedure"
