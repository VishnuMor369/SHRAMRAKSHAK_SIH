version: "1.0.0"
domain: "Oil & Gas Upstream, Rig Operations, and Industrial Facilities"
activities:
  - id: "MECHANICAL_LIFTING"
    name: "Mechanical Lifting Operations"
    description: "Cranes, rig drawworks, hoists, forklifts, slings, and rigging handling heavy tubulars, drill pipe, or plant equipment."
    keywords:
      - "lifting"
      - "lift"
      - "crane"
      - "suspended load"
      - "hoist"
      - "hoisting"
      - "rigging"
      - "sling"
      - "derrick"
      - "drawworks"
      - "catline"
      - "pipe handling"
      - "casing lift"
      - "winch"
      - "chain block"
    primary_energy: "GRAVITATIONAL_KINETIC"
    applicable_barriers:
      - "EXCLUSION_ZONE"
      - "LIFTING_CONTROL"
      - "WORK_AUTHORIZATION"

  - id: "WORKING_AT_HEIGHT"
    name: "Working at Height / Mast & Derrick"
    description: "Work performed on monkey board, rig mast, scaffolding, platforms, or ladders > 1.8 meters without passive enclosure."
    keywords:
      - "working at height"
      - "monkey board"
      - "derrick"
      - "scaffold"
      - "ladder"
      - "man basket"
      - "elevated platform"
      - "mast"
      - "staging"
      - "harness"
      - "fall arrest"
    primary_energy: "GRAVITATIONAL_HEIGHT"
    applicable_barriers:
      - "FALL_PROTECTION"
      - "WORK_AUTHORIZATION"

  - id: "ENERGY_ISOLATION_LOTO"
    name: "Energy Isolation / Lockout Tagout"
    description: "Maintenance, intervention, or repair on energized electrical, pneumatic, pressurized, or mechanical equipment."
    keywords:
      - "energy isolation"
      - "lockout"
      - "tagout"
      - "loto"
      - "isolation"
      - "breaker"
      - "depressurization"
      - "electrical maintenance"
      - "blind flange"
      - "spade"
    primary_energy: "ELECTRICAL_PRESSURE_MECHANICAL"
    applicable_barriers:
      - "ENERGY_ISOLATION"
      - "WORK_AUTHORIZATION"

  - id: "CONFINED_SPACE_ENTRY"
    name: "Confined Space Entry"
    description: "Entry into mud tanks, separators, frac tanks, vessels, or enclosed pits with restricted entry/exit or hazardous atmosphere."
    keywords:
      - "confined space"
      - "mud tank"
      - "tank entry"
      - "vessel"
      - "cellar pit"
      - "separator"
      - "enclosed space"
      - "gas tester"
    primary_energy: "ATMOSPHERIC_TOXIC"
    applicable_barriers:
      - "GAS_TESTING"
      - "WORK_AUTHORIZATION"
      - "STANDBY_RESCUE"

  - id: "HOT_WORK"
    name: "Hot Work Operations"
    description: "Welding, torch cutting, grinding, or spark-producing operations in hazardous classified zones."
    keywords:
      - "hot work"
      - "welding"
      - "cutting torch"
      - "grinding"
      - "brazing"
      - "spark"
      - "habitat"
    primary_energy: "THERMAL_IGNITION"
    applicable_barriers:
      - "GAS_TESTING"
      - "WORK_AUTHORIZATION"
      - "FIRE_WATCH"

  - id: "WELL_INTERVENTION_DRILLING"
    name: "Well Drilling & Tripping Operations"
    description: "Drilling, tripping pipe, casing operations, cementing, wireline, coiled tubing, and well control operations."
    keywords:
      - "drilling"
      - "tripping"
      - "casing"
      - "cementing"
      - "drill string"
      - "kelly"
      - "top drive"
      - "rotary table"
      - "wellbore"
      - "mud circulation"
      - "blowout preventer"
      - "bop"
    primary_energy: "HIGH_PRESSURE_HYDROCARBON"
    applicable_barriers:
      - "PRIMARY_WELL_CONTROL"
      - "SECONDARY_WELL_BARRIER"
      - "BOP_INTEGRITY"
      - "WELL_INTEGRITY_VERIFICATION"
      - "WELL_CONTROL_PROCEDURE"

  - id: "PRESSURE_TESTING"
    name: "High Pressure Testing"
    description: "Hydrostatic testing, manifold testing, casing pressure testing, or flowline proof testing."
    keywords:
      - "pressure test"
      - "hydrotest"
      - "casing test"
      - "manifold test"
      - "leak test"
      - "chart recorder"
      - "psi"
      - "bar"
    primary_energy: "HIGH_PRESSURE_STORED"
    applicable_barriers:
      - "PRESSURE_TESTING"
      - "EXCLUSION_ZONE"
      - "WORK_AUTHORIZATION"

  - id: "VEHICLE_LOGISTICS"
    name: "Heavy Vehicle & Site Logistics"
    description: "Movement of oilfield trucks, vacuum tankers, cranes, or mobile equipment on drill sites or access roads."
    keywords:
      - "vehicle"
      - "truck"
      - "trailer"
      - "forklift"
      - "tanker"
      - "mobile equipment"
      - "driving"
      - "reversing"
    primary_energy: "KINETIC_VEHICULAR"
    applicable_barriers:
      - "TRAFFIC_SEGREGATION"
