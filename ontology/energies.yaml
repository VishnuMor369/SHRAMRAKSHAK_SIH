version: "1.0.0"
energies:
  - id: "GRAVITATIONAL_KINETIC"
    name: "Gravity / Suspended Load"
    description: "Loads held aloft by crane, hoist, drawworks, pipe elevator, or overhead rigging."
    keywords:
      - "suspended load"
      - "overhead load"
      - "swinging load"
      - "dropped object"
      - "falling object"
      - "falling load"
      - "crane hook"
      - "sling tension"
    severity_level: "HIGH"
    default_consequence: "Crush trauma / blunt force impact"

  - id: "GRAVITATIONAL_HEIGHT"
    name: "Elevation / Fall Potential"
    description: "Gravitational potential energy of personnel working at height (>1.8m)."
    keywords:
      - "elevation"
      - "height"
      - "fall from height"
      - "derrick"
      - "mast"
      - "scaffold edge"
      - "open hatch"
    severity_level: "HIGH"
    default_consequence: "Fatal fall / catastrophic trauma"

  - id: "HIGH_PRESSURE_STORED"
    name: "High Pressure / Stored Pneumatic or Hydraulic"
    description: "Pressurized mud lines, standpipes, hydraulic units, accumulator bottles, flowlines (>100 psi)."
    keywords:
      - "high pressure"
      - "pressurized"
      - "burst hose"
      - "line kick"
      - "standpipe"
      - "manifold"
      - "hydraulic"
      - "pneumatic"
      - "whip check"
    severity_level: "HIGH"
    default_consequence: "Line rupture / projectile impact / fluid injection"

  - id: "HIGH_PRESSURE_HYDROCARBON"
    name: "Wellbore Hydrocarbon / Kick Potential"
    description: "Subsurface reservoir pressure, gas kick, oil/gas influx during drilling or well completion."
    keywords:
      - "gas kick"
      - "well kick"
      - "influx"
      - "reservoir pressure"
      - "blowout"
      - "formation pressure"
      - "pit gain"
    severity_level: "CATASTROPHIC"
    default_consequence: "Well blowout / major fire / loss of well control"

  - id: "ATMOSPHERIC_TOXIC"
    name: "Hazardous Gas / H2S / Toxic Vapor"
    description: "Hydrogen Sulfide (H2S), hydrocarbon vapors, oxygen-deficient environments in tanks, cellars, or pits."
    keywords:
      - "h2s"
      - "hydrogen sulfide"
      - "toxic gas"
      - "gas release"
      - "vapor cloud"
      - "oxygen deficient"
      - "asphyxiation"
      - "gas leak"
    severity_level: "CATASTROPHIC"
    default_consequence: "Toxic inhalation / asphyxiation / acute H2S fatality"

  - id: "THERMAL_IGNITION"
    name: "Thermal / Flammable Atmosphere / Sparks"
    description: "Heat sources, welding arcs, grinding sparks, open flame near combustible gas or crude."
    keywords:
      - "ignition"
      - "flammable"
      - "combustible"
      - "flash fire"
      - "explosion"
      - "sparks"
      - "welding slag"
    severity_level: "HIGH"
    default_consequence: "Flash fire / thermal burn / explosion"

  - id: "ELECTRICAL_ENERGY"
    name: "Live Electrical Conductors"
    description: "High voltage transmission, generator switchboards, motor control centers (MCC), electrical cables."
    keywords:
      - "electrical"
      - "high voltage"
      - "live wire"
      - "switchgear"
      - "mcc"
      - "electrocution"
      - "arc flash"
      - "transformer"
    severity_level: "HIGH"
    default_consequence: "Electrocution / severe arc flash burn"

  - id: "MECHANICAL_ROTATING"
    name: "Rotating Equipment / Pinch Points"
    description: "Rotary table, cathead, sheaves, mud pump belts, winch drums, agitators."
    keywords:
      - "rotary table"
      - "rotating equipment"
      - "pinch point"
      - "sheave"
      - "nip point"
      - "winch drum"
      - "agitator"
      - "entanglement"
    severity_level: "HIGH"
    default_consequence: "Severe entanglement / traumatic amputation"

  - id: "KINETIC_VEHICULAR"
    name: "Heavy Mobile Equipment / Traffic"
    description: "Rig moving trucks, trailers, forklifts, excavators navigating active locations."
    keywords:
      - "vehicle impact"
      - "struck by truck"
      - "forklift reversing"
      - "heavy equipment"
      - "trailer"
    severity_level: "HIGH"
    default_consequence: "Pedestrian crush / impact fatality"
