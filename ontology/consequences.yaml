version: "1.0.0"
consequences:
  - id: "CRUSH_TRAUMA"
    name: "Crush Trauma / Struck-by Heavy Load"
    description: "Trauma from falling tubular, heavy machine part, crane boom, or collapsing structure."
    severity: "FATALITY_OR_PERMANENT_DISABILITY"
    keywords:
      - "crush trauma"
      - "struck by"
      - "struck-by"
      - "crushed"
      - "pinned under"
      - "dropped tool"
      - "impact from pipe"

  - id: "FALL_FROM_HEIGHT"
    name: "Catastrophic Fall from Height"
    description: "Fall from derrick, monkey board, scaffold, elevated walkway >1.8 meters to floor or ground."
    severity: "FATALITY_OR_PERMANENT_DISABILITY"
    keywords:
      - "fall from height"
      - "fell from"
      - "fallen from mast"
      - "fall through opening"

  - id: "ASPHYXIATION_TOXIC"
    name: "Toxic Gas Inhalation / Acute Asphyxiation"
    description: "Inhalation of H2S gas, carbon monoxide, nitrogen, or oxygen depletion in enclosed space."
    severity: "FATALITY_OR_PERMANENT_DISABILITY"
    keywords:
      - "toxic inhalation"
      - "asphyxiation"
      - "h2s poisoning"
      - "suffocation"
      - "unconscious from gas"

  - id: "THERMAL_BURN_EXPLOSION"
    name: "Severe Thermal Burn / Flash Fire / Explosion"
    description: "Hydrocarbon vapor ignition, flash fire, pressurized hot liquid spray, electrical arc flash."
    severity: "FATALITY_OR_PERMANENT_DISABILITY"
    keywords:
      - "flash fire"
      - "explosion"
      - "burn"
      - "fire"
      - "ignited"
      - "scald"

  - id: "ELECTROCUTION"
    name: "Electrocution / High Voltage Cardiac Arrest"
    description: "Current passage through body from un-isolated electrical gear or high-voltage lines."
    severity: "FATALITY"
    keywords:
      - "electrocution"
      - "electric shock"
      - "high voltage contact"
      - "arc blast"

  - id: "TRAUMATIC_AMPUTATION"
    name: "Traumatic Amputation / Severe Entanglement"
    description: "Limb caught in rotary table, cathead, belt drive, or high-torque machinery."
    severity: "PERMANENT_DISABILITY"
    keywords:
      - "amputation"
      - "entanglement"
      - "severed"
      - "crushed hand"
      - "caught in winch"

  - id: "WELL_BLOWOUT"
    name: "Catastrophic Loss of Well Control / Blowout"
    description: "Uncontrolled hydrocarbon eruption from wellbore leading to fire, explosion, or rig destruction."
    severity: "CATASTROPHIC_MULTIPLE_FATALITY"
    keywords:
      - "blowout"
      - "loss of well control"
      - "surface blowout"
      - "underground blowout"
      - "uncontrolled flow"
